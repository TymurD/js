<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="" href="style.css">
  </head>
  <body>
  <main class="course-card" id="card">
      <p class="tag">Osvitnya platforma</p>
      <h1>Kurs z vebrozrobku</h1>
      <p id="welcome">Vitayemo, ghosty!</p>

      <label for="studentName">Vashe Imya</label>
      <input id="studentName" type="text" placeholder="Enter your name">

      <label for="format">Format navchannya</label>
      <select id="fomrat">
        <option value="1500">Online - 1500hrn</option>
        <option value="2000">Offline - 2000hrn</option>
      </select>
      <p class="cost">Vartist: <strong id="strong">1500hrn</strong></p>
      <button id="enrollBtn">Zapusatusya</button>
      <p id="status">Vi ische ne zapisani na kurs</p>

      <button id="detailsBtn" class="secondary">Pokazatu Opus</button>

      <p class="hidden" id="details">Praktuchniy kurs z veb programuvannya</p>

      <button id="themeBtn" class="secondary">Dark theme</button>
  </main>
    <script src="script.js"></script>
  </body>
</html>
